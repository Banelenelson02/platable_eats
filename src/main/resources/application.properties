spring.application.name=plateable_eats
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/plateable_eats}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Each Vercel container needs only a small pool; the transaction pooler handles scale.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
# Keep automatic table updates for local development only. Set HIBERNATE_DDL_AUTO=none
# on the deployed production environment after the existing schema is verified.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.staff.username=${STAFF_USERNAME:staff}
app.staff.password=${STAFF_PASSWORD:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.port=${PORT:8080}
