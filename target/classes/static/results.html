<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>com.plateable.model.com.plateable.model.MenuItem.MenuItem.Order Confirmed — Saylor.Eats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --clr-ink: #0d0d0d;
      --clr-cream: #faf8f4;
      --clr-warm: #f3ede3;
      --clr-gold: #c8a97e;
      --clr-gold-dark: #a8864e;
      --clr-green: #2e7d5a;
      --clr-muted: #6b6456;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--clr-cream);
      color: var(--clr-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .confirmation {
      background: #fff;
      border-radius: 1.6rem;
      padding: 4.8rem 4rem;
      max-width: 56rem;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,.1);
      text-align: center;
    }

    .confirmation__icon {
      width: 6.4rem;
      height: 6.4rem;
      background: #e8f5ee;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2.4rem;
      font-size: 2.8rem;
      color: var(--clr-green);
    }

    .confirmation__title {
      font-family: var(--font-display);
      font-size: 3.6rem;
      color: var(--clr-ink);
      margin-bottom: 0.8rem;
    }

    .confirmation__subtitle {
      font-size: 1.6rem;
      color: var(--clr-muted);
      margin-bottom: 3.2rem;
      line-height: 1.6;
    }

    .order-summary {
      background: var(--clr-warm);
      border-radius: 1.2rem;
      padding: 2.4rem;
      text-align: left;
      margin-bottom: 3.2rem;
    }

    .order-summary__heading {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--clr-gold-dark);
      margin-bottom: 1.6rem;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.8rem 0;
      border-bottom: 1px solid rgba(0,0,0,.07);
      font-size: 1.5rem;
    }
    .order-row:last-child { border-bottom: none; }
    .order-row__label { color: var(--clr-muted); font-weight: 400; }
    .order-row__value { color: var(--clr-ink); font-weight: 500; text-align: right; max-width: 60%; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--clr-ink);
      background: var(--clr-ink);
      color: #fff;
      padding: 1.2rem 2.8rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .back-link:hover { background: var(--clr-gold-dark); }

    /* Empty state */
    .empty-state {
      font-size: 1.5rem;
      color: var(--clr-muted);
      padding: 1.6rem 0;
    }

    @media (max-width: 480px) {
      .confirmation { padding: 3.2rem 2rem; }
      .confirmation__title { font-size: 2.8rem; }
    }
  </style>
</head>
<body>

  <main class="confirmation" role="main">
    <div class="confirmation__icon" aria-hidden="true">✓</div>
    <h1 class="confirmation__title">com.plateable.model.com.plateable.model.MenuItem.MenuItem.Order Placed!</h1>
    <p class="confirmation__subtitle">
      Thanks for your order. We're on it — expect your delivery in about 35–45 minutes.
    </p>

    <div class="order-summary" aria-label="com.plateable.model.com.plateable.model.MenuItem.MenuItem.Order details">
      <p class="order-summary__heading">Your com.plateable.model.com.plateable.model.MenuItem.MenuItem.Order Details</p>
      <div id="results">
        <p class="empty-state">No order details found.</p>
      </div>
    </div>

    <a href="/" class="back-link">
      ← Back to Menu
    </a>
  </main>

  <script>
    (function () {
      const resultsEl = document.getElementById('results');
      const params = new URLSearchParams(window.location.search);

      // Friendly label map
      const labels = {
        name:       'Name',
        contact:    'Contact',
        food:       'Main Dish',
        qty:        'Quantity',
        extra_food: 'Additional Item',
        extra_qty:  'Extra Qty',
        address:    'Delivery Address',
        phone:      'Phone',
        special:    'Special Instructions',
      };

      // Filter out empty or unhelpful values
      const rows = [];
      params.forEach((value, key) => {
        if (!value || value === 'undefined') return;
        const label = labels[key] || key.charAt(0).toUpperCase() + key.slice(1).replace(/_/g, ' ');
        rows.push({ label, value });
      });

      if (rows.length === 0) return; // Keep default "No order details" message

      resultsEl.innerHTML = rows
        .map(({ label, value }) => `
          <div class="order-row">
            <span class="order-row__label">${escapeHTML(label)}</span>
            <span class="order-row__value">${escapeHTML(value)}</span>
          </div>
        `)
        .join('');
    })();

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }
  </script>

</body>
</html>
