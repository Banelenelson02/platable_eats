name: Verify pixel-identical food photos
on:
  push:
    branches: [fix/dessert-plus-and-static-assets]
    paths:
      - scripts/optimize_static_images.py
      - .github/workflows/convert-images-once.yml
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for lossless conversion and pixel verification
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Convert to lossless WebP only when smaller and assert exact pixels
        run: python scripts/optimize_static_images.py
      - name: Commit verified files to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/main/resources/static/index.html src/main/resources/static/images/
          if ! git diff --cached --quiet; then
            git commit -m "perf: replace lossy photos with pixel-identical lossless assets"
            git push origin HEAD:fix/dessert-plus-and-static-assets
          fi
