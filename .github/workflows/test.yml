name: CI

on:
  push:
    branches: [main, develop, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Run unit and integration tests
        run: mvn --batch-mode clean verify
      - name: Check no hardcoded datasource password
        shell: bash
        run: |
          if grep -REn 'spring[.]datasource[.]password=[^$[:space:]]' src/main/resources; then
            echo "Hardcoded datasource password detected" >&2
            exit 1
          fi
